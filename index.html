    <script>

        // ==========================================
        // 完整的 8 节课 PPT 数据库
        // 特别注意：第 6 节严格按照用户提供的 15 页 PDF 原样提取
        // ==========================================
        const courseData = [
            {
                id: 1, code: "LECTURE 01", shortTitle: "第 1 节：Futures & Forwards",
                title: "第 1 节：Futures & Forwards 远期与期货定价、估值与套利精讲",
                slides: [
                    { page: "Slide 1 of 6", title: "1. 衍生品分类框架与 Price vs. Value 本质区别", tag: "PART 1: FUNDAMENTALS", content: `<div class="grid grid-cols-2 gap-6 h-full"><div class="bg-slate-50 p-5 rounded-xl border border-slate-200"><h3 class="text-base font-bold text-navy-900 mb-3">衍生品两大核心分类</h3><p class="mb-2"><strong>▪ 远期承诺 (Forward Commitments)：</strong>双方约定未来必须执行的合约，包含 Forwards、Futures 与 Swaps。</p><p><strong>▪ 或有要求权 (Contingent Claims)：</strong>买方有权无义务，代表为 Options（仅空头有违约可能）。</p></div><div class="bg-navy-900 text-white p-5 rounded-xl shadow-md"><h3 class="text-base font-bold text-amber-400 mb-3">面试铁律：Price vs. Value</h3><p class="mb-2"><strong>Price ($F_0$)：</strong>签约确定的交割价，存续期内恒定。</p><p class="mb-2"><strong>Value ($V_t$)：</strong>头寸市值，随市场波动，多空零和：$V_{L,t} + V_{S,t} = 0$</p><hr class="border-slate-700 my-3"><ul class="space-y-1"><li>期初 ($t=0$)：$V_{L,0} = 0$</li><li>存续期 ($t<T$)：$V_{L,t} = \\frac{F_t(T) - F_0(T)}{(1+r_f)^{T-t}}$</li></ul></div></div>`},
                    { page: "Slide 2 of 6", title: "2. 无套利复制原理与正反向 Carry 套利", tag: "PART 2: ARBITRAGE", content: `<div class="space-y-6"><div class="bg-slate-50 p-5 rounded-xl border-l-4 border-navy-900"><h3 class="font-bold text-navy-900">复制恒等式 (Replication)</h3><p class="text-lg text-center my-3 font-mono">$\\text{Asset} + \\text{Derivative} = \\text{Risk-free Asset}$</p></div><div class="grid grid-cols-2 gap-6"><div class="bg-white border p-4 rounded-xl"><h4 class="font-bold text-emerald-700 mb-2">正向套利 (Cash-and-Carry)</h4><p class="text-xs text-slate-500 mb-2">条件：$F_0(T) > S_0(1+r_f)^T$ (远期高估)</p><ul class="list-disc pl-5 text-sm space-y-1"><li>期初：借钱按 $r_f$买现货，同时卖空远期。</li><li>期末：交割现货，归还本息，无风险获利。</li></ul></div><div class="bg-white border p-4 rounded-xl"><h4 class="font-bold text-rose-700 mb-2">反向套利 (Reverse Carry)</h4><p class="text-xs text-slate-500 mb-2">条件：$F_0(T) < S_0(1+r_f)^T$ (远期低估)</p><ul class="list-disc pl-5 text-sm space-y-1"><li>期初：融券卖空现货放贷，同时做多远期。</li><li>期末：收回贷款，买入现货平仓空头获利。</li></ul></div></div></div>`},
                    { page: "Slide 3 of 6", title: "3. 含持有收益与成本的远期估值", tag: "PART 3: COST OF CARRY", content: `<div class="grid grid-cols-5 gap-6 h-full"><div class="col-span-2 space-y-4"><div class="bg-navy-900 p-4 rounded-xl text-white"><h3 class="font-bold text-amber-400 mb-2">定价通用公式</h3><p class="text-sm">$$F_0(T) = (S_0 - PVB_0 + PVC_0)(1 + r_f)^T$$</p></div><div class="bg-amber-50 p-4 rounded-xl border border-amber-200"><h3 class="font-bold text-amber-900 mb-2">存续期估值</h3><p class="text-sm">$$V_{L,t} = (S_t - PVB_t + PVC_t) - \\frac{F_0}{(1+r_f)^{T-t}}$$</p></div></div><div class="col-span-3 bg-white border border-slate-200 p-5 rounded-xl shadow-sm"><h3 class="font-bold text-rose-700 text-lg mb-3"><i class="fa-solid fa-triangle-exclamation"></i> 高频面试陷阱</h3><p class="text-base leading-relaxed text-slate-700">公式中的 $PVB_t$ 仅扣除 <strong>$t$ 时刻之后至到期日 $T$ 之间尚未派发的剩余现金流现值</strong>。</p><p class="text-base leading-relaxed text-slate-700 mt-4">站在当前时点 $t$ 估值时，<strong>$t$ 之前已派发的股息绝不能重复扣减</strong>，因为它们已经被市场吸收并反映在了当前的除息股价 $S_t$ 中！</p></div></div>`},
                    { page: "Slide 4 of 6", title: "4. 连续复利股指期货：定价与升贴水", tag: "PART 4: INDEX FUTURES", content: `<div class="grid grid-cols-2 gap-6"><div class="bg-slate-50 p-5 rounded-xl border"><h3 class="font-bold text-navy-900 mb-4">股指期货模型 (连续分红)</h3><p class="mb-3">指数成分股众多，股息近似连续派发，使用连续股息率 $\\delta^c$ 与连续利率 $r_f^c$：</p><div class="bg-white p-3 rounded-lg border shadow-sm"><p class="mb-2"><strong>定价：</strong> $$F_0(T) = S_0 \\, e^{(r_f^c - \\delta^c)T}$$</p><p><strong>估值：</strong> $$V_{L,t} = S_t e^{-\\delta^c(T-t)} - F_0 e^{-r_f^c(T-t)}$$</p></div></div><div class="space-y-4"><div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200"><h4 class="font-bold text-emerald-900">升水 (Contango)</h4><p class="text-sm mt-1">当 $r_f^c > \\delta^c$ 时，指数幂为正 $\\Rightarrow F_0 > S_0$。期货价高于现货价。</p></div><div class="bg-rose-50 p-4 rounded-xl border border-rose-200"><h4 class="font-bold text-rose-900">贴水 (Backwardation)</h4><p class="text-sm mt-1">当 $r_f^c < \\delta^c$ 时，指数幂为负 $\\Rightarrow F_0 < S_0$。期货价低于现货价。</p></div></div></div>`},
                    { page: "Slide 5 of 6", title: "5. 远期利率协议 (FRA) 定价与估值", tag: "PART 5: FRA", content: `<div class="bg-white border rounded-xl p-6 shadow-sm h-full flex flex-col justify-center"><div class="grid grid-cols-2 gap-8 mb-6"><div><h3 class="font-bold text-navy-900 mb-2">多空头寸方向</h3><p class="text-sm"><strong>Long FRA：</strong>锁定借款利率（支固定收浮动），利率上升获利。</p><p class="text-sm mt-2"><strong>Short FRA：</strong>锁定放贷利率（收固定支浮动），利率下降获利。</p></div><div><h3 class="font-bold text-navy-900 mb-2">无套利定价递推 (单利计算)</h3><p class="text-sm">$$\\left[1 + S_b \\left(\\frac{30b}{360}\\right)\\right] = \\left[1 + S_a \\left(\\frac{30a}{360}\\right)\\right] \\left[1 + \\text{FRA} \\left(\\frac{30(b-a)}{360}\\right)\\right]$$</p></div></div><div class="bg-slate-100 p-4 rounded-lg"><h3 class="font-bold text-navy-900 mb-2">到期提前结算估值折现机制</h3><p class="text-sm">底层贷款利息本应在时间 $b$ 发生，但 FRA 合约在时间 $a$ 到期并提前现金交割。因此必须将利差折现回时间 $a$：</p><p class="text-center mt-2 text-sm">$$V_{L,a} = \\frac{\\text{NP} \\times (\\text{MRR} - \\text{FRA}_0) \\times \\frac{b-a}{360}}{1 + \\text{MRR} \\times \\frac{b-a}{360}}$$</p></div></div>`},
                    { page: "Slide 6 of 6", title: "6. 国债期货 (QFP) 与 CTD 机制", tag: "PART 6: TREASURY FUTURES", content: `<div class="grid grid-cols-5 gap-6"><div class="col-span-3 space-y-4"><div class="bg-white border p-5 rounded-xl shadow-sm"><h3 class="font-bold text-navy-900 mb-2">理论报价 (QFP) 与发票金额</h3><p class="text-sm">净价与全价：$\\text{Full Price } (S_0) = \\text{Clean Price } (B_0) + AI_0$</p><div class="my-3 text-center">$$\\text{QFP} = \\frac{(B_0 + AI_0 - PVC)(1+r_f)^T - AI_T}{\\text{CF}}$$</div><p class="text-sm">交割总发票金额 $= \\text{QFP} \\times \\text{CF} + AI_T$</p></div><div class="bg-amber-50 border border-amber-200 p-5 rounded-xl"><h3 class="font-bold text-amber-900 mb-1">最便宜可交割券 (CTD)</h3><p class="text-sm">空头拥有一篮子交割期权。空头会挑选交割净成本最低的债券交割。</p></div></div><div class="col-span-2 bg-navy-900 text-white p-5 rounded-xl shadow-md"><h3 class="font-bold text-amber-400 mb-3">凸性价格偏差 (Convexity Bias)</h3><p class="text-sm mb-3">由于期货每日盯市，若标的价格与利率<strong>正相关</strong>：</p><p class="text-sm font-mono bg-white/10 p-2 text-center rounded">Futures Price > Forward Price</p><p class="text-xs text-slate-300 mt-3 leading-relaxed">机理：价格上涨时超额保证金流入，恰逢利率高，能按高息再投资。</p></div></div>`}

                slides: [

                    { page: "Slide 3 of 3", title: "3. 多策略对冲基金风控生态", tag: "INDUSTRY LANDSCAPE", content: `<div class="bg-amber-50 border border-amber-200 p-6 rounded-xl h-full flex flex-col justify-center"><h3 class="text-2xl font-bold text-amber-900 mb-6">高杠杆纯 Alpha (Citadel, Point72)</h3><div class="space-y-5"><div><h4 class="font-bold text-lg mb-1 text-amber-900">▪ 基金风控极度紧盯指标：</h4><ul class="list-disc pl-5 text-sm text-slate-800 space-y-1.5"><li><strong>最大回撤硬红线：</strong>触线直接强平。</li><li><strong>因子拥挤度：</strong>严防散户逼空。</li></ul></div><div class="bg-white p-4 rounded-lg mt-4 shadow-sm"><h4 class="font-bold text-amber-700 mb-2">🎯 最强变现岗位：</h4><ul class="list-disc pl-5 text-sm text-slate-700 space-y-1"><li>Portfolio Risk / Pod Risk Analyst</li><li>Valuation Analytics</li></ul></div></div></div>`}
                ]
            }
        ];

        let currentLessonIdx = 0;
        let currentSlideIdx = 0;
        
        // 绘图模式: 'none', 'highlight', 'eraser'
        let currentDrawMode = 'none'; 
        let isDrawing = false;
        let slideCanvasObj = null;
        
        const userNotes = { 6: "• 牢记 Z-Spread 与 OAS 区别\n• Callable 在低利率下呈现负凸性" };

        window.addEventListener('DOMContentLoaded', () => {
            renderHomeList();
            renderSidebarQuickLessons();

            document.addEventListener('keydown', (e) => {
                const ws = document.getElementById('workspace-view');
                if (ws.classList.contains('hidden')) return;
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowRight' || e.key === 'PageDown') changeSlide(1);
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') changeSlide(-1);
            });
        });

        function goToLessonList() {
            document.getElementById('home-view').classList.add('hidden');
            const lv = document.getElementById('list-view');
            lv.classList.remove('hidden');
            lv.classList.add('flex');
            window.scrollTo(0, 0);
        }

        function returnToHome() {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('flex');
            document.getElementById('home-view').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function goToList() {
            document.getElementById('workspace-view').classList.add('hidden');
            document.getElementById('workspace-view').classList.remove('flex');
            document.getElementById('list-view').classList.remove('hidden');
            document.getElementById('list-view').classList.add('flex');
            window.scrollTo(0, 0);
        }

        function renderHomeList() {
            const container = document.getElementById('lessons-grid-container');
            container.innerHTML = courseData.map((l, idx) => `
                <div onclick="openLessonWorkspace(${idx})" class="cursor-pointer bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:border-amber-400 hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-0.5 rounded bg-navy-900 text-amber-400 text-xs font-bold">${l.code}</span>
                            <span class="text-xs font-mono text-slate-500 bg-slate-100 px-2 rounded">${l.slides.length} 页 PPT</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-900 leading-snug">${l.title}</h3>
                        <p class="text-xs text-slate-500 mt-2 line-clamp-2">${l.shortTitle}</p>
                    </div>
                    <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-amber-600">
                        <span>打开 PPT 阅读器</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
            `).join('');
        }

        function renderSidebarQuickLessons() {
            const container = document.getElementById('sidebar-quick-lessons');
            container.innerHTML = courseData.map((l, idx) => `
                <div onclick="openLessonWorkspace(${idx})" class="cursor-pointer p-3 rounded-xl text-xs transition-all flex items-center justify-between ${
                    idx === currentLessonIdx ? 'bg-amber-500 text-navy-950 font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                }">
                    <span class="truncate pr-2">${l.shortTitle}</span>
                    <span class="text-[10px] opacity-80 shrink-0 bg-black/20 px-1.5 rounded">${l.slides.length}页</span>
                </div>
            `).join('');
        }

        function openLessonWorkspace(idx) {
            currentLessonIdx = idx;
            currentSlideIdx = 0;
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('flex');
            const ws = document.getElementById('workspace-view');
            ws.classList.remove('hidden');
            ws.classList.add('flex');

            renderSidebarQuickLessons();
            loadCurrentSlide();
            
            // 自动将工作区滚动到顶部
            document.getElementById('workspace-scroll-area').scrollTop = 0;
        }

        function loadCurrentSlide() {
            const lesson = courseData[currentLessonIdx];
            const slide = lesson.slides[currentSlideIdx];

            document.getElementById('header-lesson-short-title').textContent = lesson.shortTitle;
            document.getElementById('ws-lesson-code').textContent = lesson.code;
            document.getElementById('ws-lesson-title').textContent = lesson.title;

            document.getElementById('slide-top-tag').textContent = slide.tag || `${lesson.shortTitle} | SLIDE ${currentSlideIdx + 1}`;
            document.getElementById('slide-page-counter').textContent = `${currentSlideIdx + 1} / ${lesson.slides.length}`;

            const pills = document.getElementById('slide-number-pills');
            pills.innerHTML = lesson.slides.map((s, i) => `
                <button onclick="goToSlide(${i})" class="shrink-0 w-6 h-6 rounded-lg text-[11px] font-bold transition-all ${
                    i === currentSlideIdx ? 'bg-amber-500 text-navy-950 shadow' : 'bg-slate-800 text-slate-400 hover:text-white'
                }" title="第 ${i+1} 页">${i + 1}</button>
            `).join('');

            document.getElementById('single-slide-title').textContent = slide.title;
            document.getElementById('single-slide-page-badge').textContent = slide.page;
            
            const contentDiv = document.getElementById('single-slide-content');
            contentDiv.innerHTML = slide.content;

            renderKaTeX(contentDiv);
            requestAnimationFrame(() => {
                initSlideCanvas();
                applyDrawModeUI(); // 切换 PPT 后维持之前的画笔或橡皮擦状态
            });

            document.getElementById('lesson-note-area').value = userNotes[lesson.id] || "";
        }

        function changeSlide(delta) {
            const lesson = courseData[currentLessonIdx];
            const next = currentSlideIdx + delta;
            if (next >= 0 && next < lesson.slides.length) {
                currentSlideIdx = next;
                loadCurrentSlide();
            } else if (next >= lesson.slides.length) {
                showToast("已经是本节课最后一页了");
            } else if (next < 0) {
                showToast("已经是本节课第一页了");
            }
        }

        function goToSlide(idx) {
            currentSlideIdx = idx;
            loadCurrentSlide();
        }

        function initSlideCanvas() {
            const canvas = document.getElementById('single-slide-canvas');
            const parent = canvas.parentElement;
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            slideCanvasObj = { canvas, ctx };

            canvas.onmousedown = (e) => {
                if (currentDrawMode === 'none') return;
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            };
            
            canvas.onmousemove = (e) => {
                if (!isDrawing || currentDrawMode === 'none') return;
                const rect = canvas.getBoundingClientRect();
                ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                ctx.stroke();
                // 修复：每次 stroke 完立刻开启新路径，防止反复重画导致透明度叠加变深
                ctx.beginPath();
                ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            };
            
            canvas.onmouseup = () => { isDrawing = false; };
            canvas.onmouseleave = () => { isDrawing = false; };
        }

        function toggleDrawMode(mode) {
            // 如果点击的是当前已激活的模式，则关闭它（变成 none）
            if (currentDrawMode === mode) {
                currentDrawMode = 'none';
            } else {
                currentDrawMode = mode;
            }
            applyDrawModeUI();
        }

        function applyDrawModeUI() {
            const btnHighlight = document.getElementById('btn-highlight');
            const btnEraser = document.getElementById('btn-eraser');
            const canvas = document.getElementById('single-slide-canvas');

            // 1. 重置所有按钮样式和画布属性
            btnHighlight.className = "px-3 py-1.5 text-xs flex items-center gap-1.5 transition-all text-slate-200 hover:bg-slate-700";
            btnEraser.className = "px-3 py-1.5 text-xs flex items-center gap-1.5 transition-all text-slate-200 hover:bg-slate-700";
            canvas.style.pointerEvents = 'none';
            canvas.classList.remove('cursor-highlighter', 'cursor-eraser');

            // 2. 根据当前模式应用特定样式
            if (currentDrawMode === 'highlight') {
                btnHighlight.className = "px-3 py-1.5 text-xs flex items-center gap-1.5 transition-all bg-amber-500 text-navy-950 font-bold shadow-inner";
                canvas.style.pointerEvents = 'auto';
                canvas.classList.add('cursor-highlighter');
                if (slideCanvasObj) {
                    // 使用源覆盖
                    slideCanvasObj.ctx.globalCompositeOperation = 'source-over';
                    // 修复：配合 CSS 中的 mix-blend-multiply，这里使用一个柔和的透明黄色
                    // 因为每次 move 都分段了，所以不会再出现反复叠加导致变黑的问题
                    slideCanvasObj.ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)'; 
                    slideCanvasObj.ctx.lineWidth = 20;
                }
                showToast("高亮笔已开启，可在 PPT 上标记重点");
            } else if (currentDrawMode === 'eraser') {
                btnEraser.className = "px-3 py-1.5 text-xs flex items-center gap-1.5 transition-all bg-amber-500 text-navy-950 font-bold shadow-inner";
                canvas.style.pointerEvents = 'auto';
                canvas.classList.add('cursor-eraser');
                if (slideCanvasObj) {
                    // 使用 destination-out 擦除已画的像素，露出透明背景
                    slideCanvasObj.ctx.globalCompositeOperation = 'destination-out';
                    // 擦除时使用完全不透明的颜色，粗细加大方便擦除
                    slideCanvasObj.ctx.strokeStyle = 'rgba(0,0,0,1)';
                    slideCanvasObj.ctx.lineWidth = 30; 
                }
                showToast("橡皮擦已开启，可擦除笔迹");
            }
        }

        function clearCanvasDrawings() {
            if (slideCanvasObj) {
                slideCanvasObj.ctx.clearRect(0, 0, slideCanvasObj.canvas.width, slideCanvasObj.canvas.height);
                showToast("已清空当前页批注");
            }
        }

        function downloadCurrentPPT() {
            const lesson = courseData[currentLessonIdx];
            let content = `=== 北美金融风控求职平台 ===\n${lesson.title}\n共 ${lesson.slides.length} 页讲义\n\n`;
            lesson.slides.forEach(s => {
                content += `--- [ ${s.page} ] ${s.title} ---\n`;
                let textContent = s.content.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                content += textContent + "\n\n";
            });
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${lesson.shortTitle}_Slides.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("课件内容已保存为文本下载");
        }

        function saveNote() {
            const lesson = courseData[currentLessonIdx];
            userNotes[lesson.id] = document.getElementById('lesson-note-area').value;
            const status = document.getElementById('note-save-status');
            status.textContent = "已保存 ✓";
            setTimeout(() => { status.textContent = "实时自动保存"; }, 1500);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').textContent = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
        }
    </script>
</body>
</html>
